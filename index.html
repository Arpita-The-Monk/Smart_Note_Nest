<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Note Nest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            📝 Smart Note Nest
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="my-notes.html">My Notes</a>
            <a href="categories.html">Categories</a>
            <a href="favorites.html">Favorites</a>
        </div>

        <div class="nav-actions">

    <button id="search-btn">
        🔍
    </button>

    <button id="theme-btn">
        🌙
    </button>

</div>
    </nav>


    <!-- Hero Section -->
    <section class="hero">

        <h1>Your Thoughts, Organized.</h1>

        <p>
            Create, organize and manage your notes easily.
        </p>

        <a href="create-note.html" class="create-btn">
         + Create New Note
        </a>

    </section>


    <!-- Quick Overview -->
    <section class="overview">

        <h2>Quick Overview</h2>

       <div class="overview-cards">

    <div class="overview-card">
        <h3>📝</h3>
        <p>Total Notes</p>
        <strong id="total-notes">0</strong>
    </div>

    <div class="overview-card">
        <h3>⭐</h3>
        <p>Favorites</p>
        <strong id="total-favorites">0</strong>
    </div>

    <div class="overview-card">
        <h3>📂</h3>
        <p>Categories</p>
        <strong id="total-categories">0</strong>
    </div>

</div>

    </section>


    <!-- Recent Notes -->
    <section class="recent-notes">

        <h2>Recent Notes</h2>

        <div class="notes-container">

            <div class="empty-message">
                <p>No notes yet.</p>
                <p>Create your first note to get started!</p>
            </div>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
